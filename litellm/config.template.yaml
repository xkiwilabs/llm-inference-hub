model_list:
  - model_name: small
    litellm_params:
      model: hosted_vllm/${SMALL_MODEL}
      api_base: http://vllm-small:8001/v1
      api_key: "no-key-needed"

  - model_name: large
    litellm_params:
      model: hosted_vllm/${LARGE_MODEL}
      api_base: http://vllm-large:8002/v1
      api_key: "no-key-needed"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Default is 6000s — a wedged backend hangs the client for 100 minutes.
  request_timeout: 600

litellm_settings:
  drop_params: true
  # Worst case per request is request_timeout * (num_retries + 1).
  num_retries: 1
  # If large is wedged or in cooldown, serve from small instead of returning 429.
  fallbacks: [{"large": ["small"]}]
